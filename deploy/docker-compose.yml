services:
  precedent-mcp-gateway:
    image: docker.io/${DOCKER_ACCOUNT:?DOCKER_ACCOUNT is required}/precedent-mcp-gateway:1.0.0
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      GRPC_ADDRESS: precedent-mcp-server:50051
    networks:
      - default
    depends_on:
      - precedent-mcp-server

  precedent-mcp-server:
    image: docker.io/${DOCKER_ACCOUNT:?DOCKER_ACCOUNT is required}/precedent-mcp-server:1.0.0
    pull_policy: missing
    restart: unless-stopped
    environment:
      WEAVIATE_HOST: weaviate:8080
      WEAVIATE_SCHEME: http
      WEAVIATE_TEXT2VEC_MODEL: text2vec-transformers
    networks:
      - default
      - weaviate
    depends_on:
      - weaviate

  weaviate:
    image: docker.io/semitechnologies/weaviate:1.40.1
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: text2vec-transformers
      DEFAULT_VECTORIZER_MODULE: text2vec-transformers
      CLUSTER_HOSTNAME: node1
      TRANSFORMERS_INFERENCE_API: http://text2vec-transformers:8080
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - weaviate
    depends_on:
      - text2vec-transformers

  text2vec-transformers:
    image: docker.io/semitechnologies/transformers-inference:baai-bge-base-en-v1.5
    restart: unless-stopped
    environment:
      ENABLE_CUDA: "0"
    networks:
      - weaviate

networks:
  weaviate:
    internal: true

volumes:
  weaviate-data:
