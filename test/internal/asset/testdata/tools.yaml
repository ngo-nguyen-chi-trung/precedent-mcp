shared:
  failure: &failure
    type: object
    description: Unsupported key, dropped by the loader.
    properties:
      error:
        type: string
    required: [error]
tools:
- name: echo
  description: Echo the input back.
  input_schema:
    type: object
    properties:
      text:
        type: string
        minLength: 1
    required: [text]
    additionalProperties: false
  output_schema:
    type: object
    description: Unsupported key, dropped by the loader.
    anyOf:
    - type: object
      properties:
        text:
          type: string
      required: [text]
    - *failure
- name: ping
  description: No arguments.
  input_schema:
    type: object
    properties: {}
